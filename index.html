<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ArrowOut Level Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Tokens — light first, dark under media + data-theme. The board itself stays dark in both: it is the game's look. */
:root{
  color-scheme:light;
  --bg:#f1f2f6; --surface:#ffffff; --surface-2:#eceef3; --surface-3:#dfe2ea; --line:#d6dae3; --line-strong:#b6bcc9;
  --text:#171b23; --dim:#6a7282; --faint:#9aa1ae;
  --accent:#FFC315; --accent-ink:#1a1400; --accent-text:#7f6300; --accent-soft:rgba(255,195,21,.2);
  --focus:#3b82f6; --sel:#4285F4;
  --good:#1e9c5a; --warn:#a9711b; --bad:#d64545; --good-soft:rgba(30,156,90,.14); --warn-soft:rgba(169,113,27,.14); --bad-soft:rgba(214,69,69,.14);
  --outside:#e3e6ed; --board:#1c1e23; --grid:#2b2e36;
  --shadow:0 6px 24px rgba(20,24,34,.16); --shadow-s:0 2px 8px rgba(20,24,34,.12);
  --font:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --rs:7px; --rail-w:268px; --panel-w:372px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0e1116; --surface:#161a21; --surface-2:#1e232c; --surface-3:#272d38; --line:#2a303b; --line-strong:#3b4351;
  --text:#e7eaf0; --dim:#8e97a6; --faint:#5c6472;
  --accent:#FFC315; --accent-ink:#1a1400; --accent-text:#ffd45c; --accent-soft:rgba(255,195,21,.14);
  --focus:#6da1f7; --sel:#5b9cf5;
  --good:#4fcf8a; --warn:#f0b43c; --bad:#f06060; --good-soft:rgba(79,207,138,.14); --warn-soft:rgba(240,180,60,.14); --bad-soft:rgba(240,96,96,.14);
  --outside:#0a0c10; --board:#1c1e23; --grid:#2b2e36;
  --shadow:0 8px 28px rgba(0,0,0,.5); --shadow-s:0 2px 10px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1116; --surface:#161a21; --surface-2:#1e232c; --surface-3:#272d38; --line:#2a303b; --line-strong:#3b4351;
  --text:#e7eaf0; --dim:#8e97a6; --faint:#5c6472;
  --accent:#FFC315; --accent-ink:#1a1400; --accent-text:#ffd45c; --accent-soft:rgba(255,195,21,.14);
  --focus:#6da1f7; --sel:#5b9cf5;
  --good:#4fcf8a; --warn:#f0b43c; --bad:#f06060; --good-soft:rgba(79,207,138,.14); --warn-soft:rgba(240,180,60,.14); --bad-soft:rgba(240,96,96,.14);
  --outside:#0a0c10; --board:#1c1e23; --grid:#2b2e36;
  --shadow:0 8px 28px rgba(0,0,0,.5); --shadow-s:0 2px 10px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--rs);height:30px;padding:0 11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-weight:500;line-height:1}
button:hover{background:var(--surface-3)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button.primary:hover{background:#ffd04a}
button.icon{width:30px;padding:0}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--surface-2)}
button.link{background:none;border:none;height:auto;padding:0;color:var(--accent-text);text-decoration:underline;font-weight:500}
button:disabled{opacity:.4;cursor:default;transform:none}
button kbd{margin-left:2px}
input[type=number],input[type=text],input[type=search],select{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--rs);height:30px;padding:0 8px;min-width:0}
input[type=number]{font-family:var(--mono);font-size:12px;width:64px;font-variant-numeric:tabular-nums}
input[type=search]{width:100%}
select{padding-right:22px}
input[type=range]{accent-color:var(--accent);height:22px;margin:0}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);margin:0 5px 0 0;vertical-align:-1px;width:14px;height:14px}
label{color:var(--dim)}
label.chk{color:var(--text);display:inline-flex;align-items:center;min-width:0}
kbd{font:10px/1 var(--mono);background:var(--surface-2);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--text)}
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .small{font-size:11px}
b{font-weight:600}

/* ---------- Shell ---------- */
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{flex:none;display:flex;align-items:center;gap:8px;min-height:54px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:6px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--accent);position:relative;flex:none}
.logo::after{content:'';position:absolute;left:8px;top:7px;width:0;height:0;border:6px solid transparent;border-left:9px solid var(--accent-ink);border-right:0}
.brand-name{font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand-sub{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.group{display:flex;align-items:center;gap:6px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.spacer{flex:1}
.levelname{display:flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--rs);padding:0 8px 0 10px;height:30px}
.levelname .mono{color:var(--dim)}
.levelname input{background:transparent;border:none;height:26px;width:56px;padding:0 2px}
.levelname .lbl{font-size:11px;color:var(--dim);padding-left:6px;border-left:1px solid var(--line);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;font-weight:500;font-size:12px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--surface-2);color:var(--dim);font-weight:400}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--rs);padding:2px;gap:2px}
.seg button{flex:1;border:none;background:transparent;height:24px;padding:0 8px;font-weight:500;color:var(--dim)}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-s)}
.seg button b{font-family:var(--mono);font-weight:500;font-size:11px;margin-left:4px;color:var(--dim)}
.seg.lang button{padding:0 9px;font-family:var(--mono);font-size:11px;letter-spacing:.04em}

.body{flex:1;display:flex;min-height:0}
.rail{width:var(--rail-w);flex:none;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);min-height:0}
.stage{flex:1;position:relative;background:var(--outside);min-width:0;overflow:hidden}
.panel{width:var(--panel-w);flex:none;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);min-height:0}
.status{flex:none;height:26px;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--surface);border-top:1px solid var(--line);font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden}
.status .toolhint{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.status .it{display:inline-flex;align-items:center;gap:4px}
.status b{color:var(--text);font-weight:500;font-family:var(--mono)}
.status .ok{color:var(--good)} .status .bad{color:var(--bad)} .status .warn{color:var(--warn)}
.status .link{cursor:pointer;text-decoration:underline dotted}

/* ---------- Rail: levels ---------- */
.rail-head{padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.rail-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.rail-list{flex:1;overflow-y:auto;padding:6px}
.lv{display:flex;gap:10px;padding:6px 8px;border-radius:9px;cursor:pointer;align-items:center;position:relative}
.lv:hover{background:var(--surface-2)}
.lv.active{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.thumb{width:52px;height:52px;border-radius:7px;background:var(--board);flex:none}
.lv-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lv-title{font-weight:500;font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lv-meta{font-size:11px;color:var(--dim)}
.tag{font:10px var(--font);font-weight:500;padding:1px 6px;border-radius:999px;background:var(--surface-3);color:var(--dim);white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.good{background:var(--good-soft);color:var(--good)}
.dots{display:flex;gap:3px;margin-top:1px}
.dots i{width:9px;height:9px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
.lv-actions{display:none;gap:2px;position:absolute;right:6px;top:6px;background:var(--surface);border-radius:8px;padding:2px;box-shadow:var(--shadow-s)}
.lv:hover .lv-actions{display:flex}
.lv-actions button{width:26px;height:26px}
.empty{padding:24px 14px;color:var(--dim);text-align:center;line-height:1.5}
.rail-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.rail-foot button{flex:none}
.rail-foot .grow{flex:1;min-width:0}

/* ---------- Stage ---------- */
#canvas{display:block;position:absolute;inset:0;touch-action:none}
.stage.drop::after{content:attr(data-drop);position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--text);font-size:14px;font-weight:500;pointer-events:none;text-align:center;padding:20px}
.float{position:absolute;display:flex;gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow)}
.dock{left:12px;top:12px;flex-direction:column;gap:3px}
.tool{width:36px;height:36px;padding:0;border-color:transparent;background:transparent;position:relative;border-radius:9px}
.tool:hover{background:var(--surface-2)}
.tool.active{background:var(--accent);color:var(--accent-ink)}
.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool .key{position:absolute;right:3px;bottom:2px;font:9px var(--mono);color:var(--faint)}
.tool.active .key{color:var(--accent-ink);opacity:.7}
.dock .sep{width:24px;height:1px;margin:2px auto}
.palette-bar{left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 24px);overflow-x:auto;gap:6px}
.palette-bar .plabel{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:0 4px 0 6px;white-space:nowrap}
#palette{display:flex;gap:4px}
.swatch{width:28px;height:28px;border-radius:8px;border:2px solid transparent;padding:0;position:relative;background:none;flex:none}
.swatch i{position:absolute;inset:0;border-radius:6px;border:1px solid rgba(0,0,0,.3)}
.swatch .key{position:absolute;right:2px;bottom:0;font:9px var(--mono);color:rgba(0,0,0,.7);z-index:1;text-shadow:0 0 2px rgba(255,255,255,.7)}
.swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--surface)}
.swatch.add{border:1px dashed var(--line-strong);color:var(--dim);font-size:16px}
.swatch.add:hover{color:var(--text);border-color:var(--text)}
.zoom{right:12px;bottom:12px}
.zoom button{height:28px}
.zoom button.icon{width:28px}
#zoomLabel{min-width:44px;text-align:center}
.chip{left:68px;top:58px;padding:6px 10px;color:var(--text);gap:6px}
.toolopts{left:68px;top:12px;padding:5px 10px;gap:8px;max-width:calc(100% - 170px);flex-wrap:wrap;color:var(--text);min-height:38px}
.toolopts .tname{font-weight:600;padding-right:10px;border-right:1px solid var(--line)}
.toolopts .seg button{height:22px}
.toolopts select{height:26px}
.toolopts .sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.3);display:inline-block;flex:none}
.toolopts .hint{white-space:nowrap}
.toolopts button.small{height:26px;padding:0 8px}
.chip b{color:var(--accent-text)}
.chip button{height:24px;padding:0 8px}
.hintchip{left:50%;transform:translateX(-50%);bottom:60px;color:var(--dim);white-space:nowrap;padding:6px 12px;max-width:calc(100% - 140px);overflow:hidden;text-overflow:ellipsis}
.previewchip{left:50%;transform:translateX(-50%);top:12px;white-space:nowrap;padding:6px 8px 6px 12px;gap:10px;background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.previewchip button{height:26px;background:var(--accent-ink);color:var(--accent);border-color:transparent}
.previewchip button:hover{background:#000}
.previewchip .small{opacity:.75;font-weight:400}
.app.preview .stage{box-shadow:inset 0 0 0 3px var(--accent)}
.app.preview .dock,.app.preview .palette-bar{opacity:.35;pointer-events:none}
.app.preview .toolopts{display:none}

/* ---------- Panel ---------- */
.panel-tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
.panel-tabs button{flex:1;border:none;background:transparent;color:var(--dim);height:34px;border-radius:var(--rs);flex-direction:column;gap:1px;line-height:1.1}
.panel-tabs button small{font-size:10px;font-weight:400;opacity:.8}
.panel-tabs button:hover{background:var(--surface-2)}
.panel-tabs button.active{background:var(--accent-soft);color:var(--accent-text)}
.panel-body{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.panel-body{scroll-behavior:auto}}
.pane{display:none} .pane.active{display:block}

/* Stepper strip — the generator IS a sequence, so the numbers carry meaning */
.steps{position:sticky;top:0;z-index:3;display:flex;gap:2px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.steps button{flex:1;border:none;background:transparent;height:auto;padding:5px 4px;flex-direction:column;gap:3px;color:var(--dim);font-size:10.5px;font-weight:500;border-radius:8px;position:relative;letter-spacing:.02em}
.steps button:hover{background:var(--surface-2)}
.steps button i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-3);color:var(--dim);font:11px var(--mono);font-style:normal;font-weight:500}
.steps button.done i{background:var(--good);color:#fff}
.steps button.current{color:var(--text)}
.steps button.current i{background:var(--accent);color:var(--accent-ink)}
.steps button.current::after{content:'';position:absolute;left:18%;right:18%;bottom:-8px;height:2px;background:var(--accent);border-radius:2px}
.steps button+button::before{content:'';position:absolute;left:-1px;top:14px;width:2px;height:2px;background:var(--line-strong);border-radius:1px}

.card{padding:12px 14px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.card h3{margin:0 0 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .right{margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0;font-family:var(--mono)}
.card .lead{margin:-2px 0 2px;color:var(--dim);font-size:12px;line-height:1.45}
.step{padding:14px 14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px;scroll-margin-top:60px}
.step.current{background:linear-gradient(to right,var(--accent-soft),transparent 40%)}
.step-head{display:flex;gap:10px;align-items:flex-start}
.step-head .num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--dim);font:12px var(--mono);font-style:normal;font-weight:500;flex:none;margin-top:1px}
.step.done .step-head .num{background:var(--good);color:#fff}
.step.current .step-head .num{background:var(--accent);color:var(--accent-ink)}
.step-head h3{margin:0;font-size:14px;font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-wrap:balance}
.step-head h3 .state{font:11px var(--mono);font-weight:400;color:var(--dim)}
.step-head p{margin:2px 0 0;color:var(--dim);font-size:12px;line-height:1.45;max-width:46ch}
.step-body{display:flex;flex-direction:column;gap:8px}
.step.collapsed .step-body{display:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row>label:first-child{min-width:92px;flex:none}
.row input[type=range]{flex:1 1 0;width:0;min-width:50px}
.row .grow{flex:1}
.row.off{opacity:.6}
.val{font-family:var(--mono);font-size:12px;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.hint{color:var(--dim);font-size:11.5px;line-height:1.45}
.hint b{color:var(--text);font-weight:500}
.hint.ok{color:var(--good)} .hint.warn{color:var(--warn)}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btnrow .grow{flex:1}
.list{display:flex;flex-direction:column;gap:3px}
.item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:var(--rs);background:var(--surface-2)}
.item:hover{background:var(--surface-3)}
.item .sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.3);flex:none}
.item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.item .cnt{font-family:var(--mono);font-size:11px;color:var(--dim)}
.item.active{box-shadow:inset 0 0 0 1px var(--accent)}
.item.zone{flex-wrap:wrap;row-gap:5px;cursor:pointer}
.item.zone .brk{flex-basis:100%;height:0}
.item.zone button{height:24px;padding:0 7px}
.item.zone select{height:24px;font-size:12px;max-width:120px}
.item.zone .zopts{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex:1}
.item.roll{cursor:pointer}
.item.roll .name{font-family:var(--mono);font-size:11px}
.item.err{cursor:pointer}
.item .badge{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--bad-soft);color:var(--bad);font-weight:500}
.item.warn .badge{background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;background:var(--surface-2);border-radius:var(--r);padding:10px 12px}
.stat{display:flex;justify-content:space-between;gap:6px;font-size:12px}
.stat span{color:var(--dim)}
.stat b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.stat.wide{grid-column:1/-1;border-top:1px solid var(--line);padding-top:5px;margin-top:2px}
.radios{display:flex;gap:12px;flex-wrap:wrap}
.calc{font-family:var(--mono);font-size:11.5px;color:var(--dim);background:var(--surface-2);border-radius:var(--rs);padding:7px 10px;line-height:1.5}
.calc b{color:var(--text);font-weight:500}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:16px 12px;text-align:center;color:var(--dim);display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.drop b{color:var(--text);font-weight:500}
.icons{display:flex;flex-wrap:wrap;gap:5px}
.icon-btn{width:36px;height:36px;padding:4px;background:var(--surface-2);border-color:var(--line);border-radius:8px}
.icon-btn:hover{background:var(--surface-3)}
.icon-btn img{width:100%;height:100%;display:block}
.image-chip{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:var(--r);padding:8px}
.image-chip canvas{width:52px;height:52px;border-radius:7px;background:#0e1013;flex:none}
.image-chip .grow{flex:1;min-width:0}
.image-chip .name{font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.adv{border:none}
details.adv summary{cursor:pointer;color:var(--dim);font-size:12px;list-style:none;display:flex;align-items:center;gap:6px;user-select:none;padding:2px 0}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:'';width:0;height:0;border:4px solid transparent;border-left:5px solid var(--dim);transition:transform .12s}
details.adv[open] summary::before{transform:rotate(90deg)}
details.adv .adv-body{display:flex;flex-direction:column;gap:8px;padding:8px 0 0 14px}

/* Form-mode choice: two big options, the only real fork in the flow */
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode button{height:auto;padding:9px 10px;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;white-space:normal;line-height:1.3;border-radius:var(--r)}
.mode button .mt{font-weight:600;display:flex;align-items:center;gap:6px}
.mode button .mt svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mode button .md{font-size:11px;font-weight:400;color:var(--dim)}
.mode button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.mode button.active .md{color:var(--text);opacity:.75}
.bigbtn{height:38px;font-size:14px;font-weight:600}
.legend{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px;color:var(--dim);line-height:1.4}
.legend b{color:var(--text);font-weight:500;white-space:nowrap}
.callout{background:var(--surface-2);border-radius:var(--r);padding:9px 11px;font-size:12px;line-height:1.45;color:var(--text);display:flex;gap:8px;align-items:flex-start}
.callout .ico{flex:none;width:18px;text-align:center}
.callout.warn{background:var(--warn-soft)}
.callout.good{background:var(--good-soft)}
/* Pinned panel footer: reset actions always one click away, like the stepper on top */
.panel-foot{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);white-space:nowrap;overflow-x:auto}
.panel-foot .pf-label{color:var(--dim);font-size:11.5px;margin-right:2px;flex:none}
.panel-foot button{height:26px;padding:0 9px;font-size:12px;flex:none}
.panel-foot button:hover{color:var(--bad);border-color:var(--bad)}

/* ---------- Modal / toast ---------- */
.modal-back{position:fixed;inset:0;background:rgba(8,10,14,.55);display:none;place-items:center;z-index:50;padding:16px}
.modal-back.open{display:grid}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:300px;max-width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal h3{margin:0;padding:14px 18px;font-size:14px;border-bottom:1px solid var(--line);font-weight:600}
.modal .mbody{padding:14px 18px;overflow:auto;line-height:1.55}
.modal .mbody p{margin:0 0 8px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.modal pre{margin:0;font:11.5px/1.45 var(--mono);background:var(--surface-2);padding:12px;border-radius:var(--rs);max-height:52vh;overflow:auto}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;align-items:center}
.help h4{margin:14px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.help h4:first-child{margin-top:0}
.help .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.help .flow div{background:var(--surface-2);border-radius:var(--r);padding:10px;font-size:12px;line-height:1.4}
.help .flow div i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:12px var(--mono);font-style:normal;margin-bottom:6px}
.help .flow div b{display:block;font-weight:600;margin-bottom:2px}
.help .ways{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help .ways div{border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:12px;line-height:1.45}
.help .ways b{display:block;margin-bottom:3px}
.help table{width:100%;border-collapse:collapse;font-size:12px}
.help td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.help td:first-child{width:34px}
.help td svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.help td:nth-child(2){font-weight:500;white-space:nowrap}
.help td:last-child{color:var(--dim)}
.help .tip{color:var(--dim);font-size:12px}
.toasts{position:fixed;left:var(--rail-w);right:var(--panel-w);top:calc(54px + 62px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none;padding:0 12px}
.toast{background:var(--surface);color:var(--text);border:1px solid var(--line);border-left:3px solid var(--sel);padding:8px 12px;border-radius:9px;box-shadow:var(--shadow);font-size:12px;max-width:min(420px,100%);animation:in .15s ease-out;pointer-events:auto;cursor:pointer}
.toast:hover{opacity:.85}
.toast.ok{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none} details.adv summary::before{transition:none} button:active{transform:none}}

/* ---------- Mobile ---------- */
.mnav{display:none}
@media (max-width:900px){
  .top{padding:8px 12px}
  .brand-sub,.levelname .lbl,.hide-sm{display:none}
  .body{flex-direction:column}
  .rail,.panel{width:auto;border:none;border-top:1px solid var(--line);flex:1}
  .rail,.panel,.stage{display:none}
  .app[data-view=levels] .rail{display:flex}
  .app[data-view=stage] .stage{display:block}
  .app[data-view=panel] .panel{display:flex}
  .mnav{display:flex;flex:none;gap:4px;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
  .mnav button{flex:1;border:none;background:transparent;color:var(--dim)}
  .mnav button.active{background:var(--accent-soft);color:var(--accent-text)}
  .status{display:none}
  .dock{flex-direction:row;left:12px;right:12px;top:auto;bottom:60px;justify-content:center;overflow-x:auto}
  .palette-bar{bottom:12px}
  .zoom{right:12px;top:12px;bottom:auto}
  .hintchip{display:none}
  .toolopts{left:12px;right:150px;top:12px;max-width:none}
  .chip{left:12px;top:auto;bottom:112px}
  .toasts{left:12px;right:12px;top:calc(60px + env(safe-area-inset-top,0px))}
  .help .flow,.help .ways{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){ .help .flow{grid-template-columns:1fr} .mode{grid-template-columns:1fr} }

function applyStaticI18n(){

// Уровни игры подключаются из levels.js (window.PACKED_LEVELS, см. tools/pack_levels.py): c — палитра цветов, p — [цвет, буква dir, x, y головы, ходы к хвосту R/L/U/D в координатах файла (Y снизу)]
const PACKED_LEVELS = (window.PACKED_LEVELS && window.PACKED_LEVELS.l) ? window.PACKED_LEVELS : {"c":[],"l":{}};
const DIR_BY_LETTER={U:'up',D:'down',L:'left',R:'right'}; const MOVE_BY_LETTER={R:[1,0],L:[-1,0],U:[0,1],D:[0,-1]};
function unpackLevels(pk){ const out={}; for(const n in pk.l){ const L=pk.l[n]; out[n]={w:L.w,h:L.h,t:L.t,p:L.p.map(([ci,d,x,y,moves])=>{ const flat=[x,y]; for(const ch of moves){ const [dx,dy]=MOVE_BY_LETTER[ch]; x+=dx; y+=dy; flat.push(x,y); } return [pk.c[ci], DIR_BY_LETTER[d], flat]; })}; } return out; }
const REAL_LEVELS = unpackLevels(PACKED_LEVELS);
const REAL_LEVEL_NUMBERS = Object.keys(REAL_LEVELS).map(Number).sort((a,b)=>a-b);
// игра нумерует уровни по порядку в каталоге, а не по числу в имени (файлов 23 и 78 нет) — level_024.json в игре двадцать третий
function inGameNumber(n){ const i=REAL_LEVEL_NUMBERS.indexOf(n); return i<0?null:i+1; }

/* ================= State ================= */
let nextId = 1;
const state = {
  doc:null, palette:PALETTE_SEED.map(([name,hex])=>({name,hex})), activeColor:0,
  tool:'draw', source:'draw', selection:new Set(), undo:[], redo:[],
  view:{zoom:1,panX:0,panY:0}, image:null,
  gen:{width:34,k:4,minZone:6,minLen:6,maxLen:18,straight:0.85,seed:1834,difficulty:'Any',brush:1,activeZone:0,lastResult:null,pattern:'concentric',mirror:false,axis:'auto',history:[],ignoreDark:true,outline:1,autoK:true,foundK:null,brushErase:false,underlayAlpha:0.5},
  imp:{cols:22,rows:37,crop:{l:0,t:0,r:0,b:0},bg:40,head:60},
  solve:null, errors:[], savedLevels:new Map(), openedNumber:null,
  stroke:null, marquee:null, mergePending:null, hover:null, seam:null, painting:null, erasing:false, spaceDown:false, panning:null,
  draftAt:null, validated:false, preview:false
};
const $ = id => document.getElementById(id);

/* ================= Document ================= */
function makeDoc(cols, rows){
  return {cols, rows, snakes:[], zoneMap:new Array(cols*rows).fill(0),
    zones:[{name:'Zone A', color:'#8a95a8', isBody:true, paletteIdx:-1, keepSource:false, count:0}],
    timer:{mode:'formula', seconds:120, generosity:0, bonus:0}, meta:{source:'draw', seed:null, image:null}};
}
const key = (x,y)=>x+','+y;
const inGrid = (doc,x,y)=>x>=0&&y>=0&&x<doc.cols&&y<doc.rows;
const headOf = s=>s.cells[s.cells.length-1];
const tailOf = s=>s.cells[0];
const adjacent = (a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1;
function stepDir(a,b){ const dx=b.x-a.x, dy=b.y-a.y; return dx===1?'right':dx===-1?'left':dy===1?'down':dy===-1?'up':null; }
function syncDir(s){ if(s.cells.length>=2) s.dir = stepDir(s.cells[s.cells.length-2], headOf(s)) || s.dir || 'up'; if(!s.dir) s.dir='up'; }
function makeSnake(cells, color, extra){ const s=Object.assign({id:nextId++, cells:cells.map(c=>({x:c.x,y:c.y})), color, dir:'up', uncertain:false}, extra||{}); syncDir(s); return s; }
function buildOcc(doc){ const m=new Map(); doc.snakes.forEach((s,i)=>s.cells.forEach(c=>m.set(key(c.x,c.y),i))); return m; }
function snakeById(id){ return state.doc.snakes.find(s=>s.id===id); }
function zoneAt(doc,x,y){ return inGrid(doc,x,y)?doc.zoneMap[y*doc.cols+x]:-1; }
function zoneDisplayColor(doc, z){ const zone=doc.zones[z]; if(!zone) return '#888'; if(zone.keepSource||zone.paletteIdx<0) return zone.color; return (state.palette[zone.paletteIdx]||state.palette[0]).hex; }
function recountZones(doc){ doc.zones.forEach(z=>z.count=0); doc.zoneMap.forEach(z=>{ if(z>=0&&doc.zones[z]) doc.zones[z].count++; }); }

/* ================= Undo ================= */
function snapshot(){ return JSON.stringify(state.doc); }
function pushUndo(){ state.undo.push(snapshot()); if(state.undo.length>120) state.undo.shift(); state.redo.length=0; }
function undo(){ if(!state.undo.length){ toast(t('toast.nothingUndo')); return; } state.redo.push(snapshot()); state.doc=JSON.parse(state.undo.pop()); afterChange(); toast('Undo'); }
function redo(){ if(!state.redo.length){ toast(t('toast.nothingRedo')); return; } state.undo.push(snapshot()); state.doc=JSON.parse(state.redo.pop()); afterChange(); toast('Redo'); }

/* ================= Operations (LevelDocument) ================= */
function opAddSnake(cells){ if(!cells.length) return; if(cells.length<MIN_SNAKE_CELLS){ toast(t('toast.minSnake',{n:MIN_SNAKE_CELLS}),'warn'); render(); return; } pushUndo(); const s=makeSnake(cells, state.palette[state.activeColor].hex); state.doc.snakes.push(s); afterChange(); }
function opExtendTail(id, stroke){ const s=snakeById(id); if(!s) return; pushUndo(); s.cells=[...stroke.slice(1).reverse().map(c=>({x:c.x,y:c.y})), ...s.cells]; syncDir(s); afterChange(); }
function opFlip(ids){ pushUndo(); ids.forEach(id=>{ const s=snakeById(id); if(!s) return; if(s.cells.length===1) s.dir=DIR_CW[s.dir]; else { s.cells.reverse(); syncDir(s); } s.uncertain=false; }); afterChange(); }
function opSplit(snakeIdx, i){ // seam between cells[i] and cells[i+1]
  const s=state.doc.snakes[snakeIdx]; if(!s||i<0||i>=s.cells.length-1) return;
  const a=s.cells.slice(0,i+1), b=s.cells.slice(i+1); if(a.length<MIN_SNAKE_CELLS||b.length<MIN_SNAKE_CELLS){ toast(t('toast.splitTooShort',{n:MIN_SNAKE_CELLS}),'warn'); return; } pushUndo();
  const sa=makeSnake(a, s.color, {dir: stepDir(a[a.length-1], b[0])}); syncDir(sa);
  const sb=makeSnake(b, s.color, {dir:s.dir, uncertain:s.uncertain}); syncDir(sb);
  state.doc.snakes.splice(snakeIdx,1,sa,sb); state.selection.delete(s.id); afterChange();
}
function opMerge(a, endA, b, endB){ pushUndo(); const A=endA==='tail'? a.cells.slice().reverse(): a.cells.slice(); const B=endB==='head'? b.cells.slice().reverse(): b.cells.slice();
  const m=makeSnake([...A,...B], a.color); state.doc.snakes=state.doc.snakes.filter(s=>s!==a&&s!==b); state.doc.snakes.push(m); state.selection.delete(a.id); state.selection.delete(b.id); afterChange(); }
function eraseCellNoUndo(x,y, whole){ const occ=buildOcc(state.doc); const oi=occ.get(key(x,y)); if(oi===undefined) return false; const s=state.doc.snakes[oi];
  if(whole||s.cells.length<=MIN_SNAKE_CELLS){ state.doc.snakes.splice(oi,1); state.selection.delete(s.id); return true; } // из двухклеточной клетку не вынуть — только целиком
  const i=s.cells.findIndex(c=>c.x===x&&c.y===y);
  if(i===0){ s.cells.shift(); syncDir(s); return true; }
  if(i===s.cells.length-1){ s.cells.pop(); syncDir(s); return true; }
  const a=s.cells.slice(0,i), b=s.cells.slice(i+1); const parts=[];
  if(a.length>=MIN_SNAKE_CELLS){ const sa=makeSnake(a, s.color, {dir: stepDir(a[a.length-1], s.cells[i])}); syncDir(sa); parts.push(sa); }
  if(b.length>=MIN_SNAKE_CELLS){ const sb=makeSnake(b, s.color, {dir:s.dir}); syncDir(sb); parts.push(sb); }   // обрубок в одну клетку пропадает вместе со стёртой
  state.doc.snakes.splice(oi,1,...parts); state.selection.delete(s.id); return true; }
function opDelete(ids){ if(!ids.length) return; pushUndo(); state.doc.snakes=state.doc.snakes.filter(s=>!ids.includes(s.id)); state.selection.clear(); afterChange(); toast(t('toast.deleted',{n:ids.length})); }
function opRecolor(ids, hex){ pushUndo(); ids.forEach(id=>{ const s=snakeById(id); if(s) s.color=hex; }); afterChange(); }
function opNormalize(){ pushUndo(); let changed=0; state.doc.snakes.forEach(s=>{ const n=nearestPaletteHex(s.color); if(n!==s.color){ s.color=n; changed++; } }); afterChange(); toast(changed?t('toast.normalized',{n:changed}):t('toast.normalizedNone'),'ok'); }
function opResize(cols, rows){ const d=state.doc; if(cols===d.cols&&rows===d.rows) return; pushUndo(); const zm=new Array(cols*rows).fill(-1);
  for(let y=0;y<Math.min(rows,d.rows);y++) for(let x=0;x<Math.min(cols,d.cols);x++) zm[y*cols+x]=d.zoneMap[y*d.cols+x];
  d.cols=cols; d.rows=rows; d.zoneMap=zm; afterChange(); fitView(); render(); }
function opSetTimer(patch){ pushUndo(); Object.assign(state.doc.timer, patch); afterChange(); }
function opSetBoard(w,h){ const d=state.doc; pushUndo(); d.cols=w; d.rows=h; d.zoneMap=new Array(w*h).fill(Math.max(0,state.gen.activeZone)); afterChange(); fitView(); render(); toast(t('toast.boardSet',{w,h})); }
function opFillRegion(){ pushUndo(); state.doc.zoneMap.fill(Math.max(0,state.gen.activeZone)); afterChange(); }
function opClearRegion(){ pushUndo(); state.doc.zoneMap.fill(-1); afterChange(); }
function opMergeZone(z){ const d=state.doc; if(d.zones.length<2) return; const border=new Array(d.zones.length).fill(0); for(let y=0;y<d.rows;y++) for(let x=0;x<d.cols;x++){ if(d.zoneMap[y*d.cols+x]!==z) continue; for(const dd in DIRS){ const [dx,dy]=DIRS[dd]; const nz=zoneAt(d,x+dx,y+dy); if(nz>=0&&nz!==z) border[nz]++; } }
  let into=-1; border.forEach((v,j)=>{ if(v>0&&(into<0||v>border[into])) into=j; }); if(into<0){ toast(t('toast.zoneNoNeighbors'),'warn'); return; }
  pushUndo(); const name=d.zones[into].name; d.zoneMap=d.zoneMap.map(v=>v===z?into:v>z?v-1:v); d.zones.splice(z,1); if(state.gen.activeZone>=d.zones.length) state.gen.activeZone=0; afterChange(); toast(t('toast.zoneMerged',{name})); }
function opDilateZone(z){ const d=state.doc; const src=d.zoneMap.slice(); let n=0; for(let y=0;y<d.rows;y++) for(let x=0;x<d.cols;x++){ const i=y*d.cols+x; const cur=src[i]; if(cur===z||cur<0||!d.zones[cur]||!d.zones[cur].isBody) continue; let adj=false; for(const dd in DIRS){ const [dx,dy]=DIRS[dd]; if(inGrid(d,x+dx,y+dy)&&src[(y+dy)*d.cols+x+dx]===z) adj=true; } if(adj){ d.zoneMap[i]=z; n++; } }
  if(!n){ toast(t('toast.zoneNoGrow'),'warn'); return; } state.undo.push(JSON.stringify(Object.assign({},d,{zoneMap:src}))); state.redo.length=0; afterChange(); toast(t('toast.zoneDilated',{name:d.zones[z].name,n})); }
function opAddZone(){ pushUndo(); const d=state.doc; const idx=d.zones.length; d.zones.push({name:'Zone '+String.fromCharCode(65+idx), color:state.palette[idx%state.palette.length].hex, isBody:true, paletteIdx:idx%state.palette.length, keepSource:false, count:0}); state.gen.activeZone=idx; afterChange(); }
function opSetZones(zoneMap, zones, meta){ pushUndo(); state.doc.zoneMap=zoneMap; state.doc.zones=zones; Object.assign(state.doc.meta, meta||{}); state.gen.activeZone=Math.max(0, zones.findIndex(z=>z.isBody)); afterChange(); }
function opReplaceSnakes(snakes, meta, onlyRegion, skipUndo){ if(!skipUndo) pushUndo(); const d=state.doc;
  if(onlyRegion){ const region=new Set(); d.zoneMap.forEach((z,i)=>{ if(z>=0&&d.zones[z]&&d.zones[z].isBody) region.add(key(i%d.cols, Math.floor(i/d.cols))); }); d.snakes=d.snakes.filter(s=>!s.cells.some(c=>region.has(key(c.x,c.y)))); }
  else d.snakes=[];
  d.snakes.push(...snakes); Object.assign(d.meta, meta||{}); state.selection.clear(); afterChange(); }
function nearestPaletteIdx(hex){ const c=hexRgb(hex); let bi=0,bd=1e9; state.palette.forEach((p,i)=>{ const d=dist2(c,hexRgb(p.hex)); if(d<bd){bd=d;bi=i;} }); return bi; }
function nearestPaletteHex(hex){ return state.palette[nearestPaletteIdx(hex)].hex; }

/* ================= Colour utils ================= */
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbHex(c){ return '#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase(); }
function dist2(a,b){ return (a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2; }
function shade(hex, k){ const c=hexRgb(hex); return rgbHex(c.map(v=>v*k)); }

/* ================= Solver (ArrowOutLevelSolver, greedy rounds) ================= */

/* ================= Generator (ArrowOutLevelGenerator.GenerateFromZones — peeling по зонам + паттерны + зеркало) ================= */

// Одноклеточных в игре не бывает. Что не склеилось в absorbShort: 1) две соседние одиночки одной зоны → одна двухклеточная;

/* ================= ImageZoneQuantizer (k-means по клеткам, фон по углам, вливание мелких зон) ================= */

  g.beginPath(); s.cells.forEach((c,i)=>{ const p=center(c,cs); i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y); }); g.stroke(); }

}

function fitView(){ const r=wrap.getBoundingClientRect(); const bw=state.doc.cols*CELL, bh=state.doc.rows*CELL; const z=Math.max(0.12, Math.min((r.width-48)/bw,(r.height-48)/bh, 2.5)); state.view.zoom=z; state.view.panX=(r.width-bw*z)/2; state.view.panY=(r.height-bh*z)/2; }

/* ================= Library: общая (db артефакта) или локальная (localStorage) ================= */
const LIB_KEY='levelStudioWeb.library.v1';
const Library = {
  backend:'local', db:null, canWrite:true, items:[], listeners:[],
  async init(){
    try{
      const db=(window.claude&&window.claude.use)? await window.claude.use('db') : null;
      if(db){ this.db=db; this.backend='db';
        try{ const user=await window.claude.use('user'); const cw=user? await user.can('data.write') : null; this.canWrite = cw!==false; }catch(e){}
        db.collection('levels').orderBy('number').onSnapshot(snap=>{ this.items=snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id}, d.data())); this.emit(); },
          err=>{ toast(t('lib.dbUnavailable',{code:(err&&err.code||'?')}), 'warn'); this.db=null; this.backend='local'; this.loadLocal(); this.emit(); });
        return; }
    }catch(e){}
    this.loadLocal(); this.emit(); },
  loadLocal(){ try{ this.items=JSON.parse(localStorage.getItem(LIB_KEY)||'[]'); }catch(e){ this.items=[]; } this.items.sort((a,b)=>a.number-b.number); },
  saveLocal(){ try{ localStorage.setItem(LIB_KEY, JSON.stringify(this.items)); }catch(e){ toast(t('lib.localFull'),'bad'); } },
  onChange(fn){ this.listeners.push(fn); },
  emit(){ this.listeners.forEach(f=>f(this.items)); },
  get(n){ return this.items.find(it=>it.number===n); },
  byId(id){ return this.items.find(it=>it.id===id); },
  async put(entry){ if(this.db){ await this.db.doc('levels/'+entry.id).set(entry); return; }
    const i=this.items.findIndex(it=>it.id===entry.id); if(i>=0) this.items[i]=entry; else this.items.push(entry); this.items.sort((a,b)=>a.number-b.number); this.saveLocal(); this.emit(); },
  async remove(id){ if(this.db){ await this.db.doc('levels/'+id).delete(); return; } this.items=this.items.filter(it=>it.id!==id); this.saveLocal(); this.emit(); }
};

async function saveFile(name, data){
  let dl=null; try{ dl=(window.claude&&window.claude.use)? await window.claude.use('downloads') : null; }catch(e){}
  if(dl){ try{ await dl.save({filename:name, data}); return true; }catch(e){ if(e&&e.code==='declined') return false; toast(t('file.dlFailed',{code:(e&&e.code||'?')}),'warn'); return false; } }
  try{ const blob=data instanceof Blob? data : new Blob([data],{type:'application/octet-stream'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); return true; }
  catch(e){ toast(t('file.dlUnavailable'),'bad'); return false; } }
async function downloadJson(){ const n=currentLevelNumber(); const name=levelFileName(n); if(await saveFile(name, JSON.stringify(exportJson(state.doc,n),null,2))) toast(t('file.downloaded',{name}),'ok'); }
async function downloadLibraryLevel(id){ const it=Library.byId(id); if(!it) return; const name=levelFileName(it.number); if(await saveFile(name, JSON.stringify(exportJson(it.doc,it.number),null,2))) toast(t('file.downloadedShort',{name}),'ok'); }
async function downloadZip(){ if(!Library.items.length){ toast(t('file.zipEmpty'),'warn'); return; } if(!window.JSZip){ toast(t('file.zipNoLib'),'warn'); return; }
  const zip=new JSZip(); Library.items.forEach(it=>zip.file('levels/'+levelFileName(it.number), JSON.stringify(exportJson(it.doc,it.number),null,2)));
  const blob=await zip.generateAsync({type:'blob'}); if(await saveFile('arrowout-levels.zip', blob)) toast(t('file.zipDone',{n:Library.items.length}),'ok'); }
function copyJson(){ const text=JSON.stringify(exportJson(state.doc,currentLevelNumber()),null,2); (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast(t('file.copied'),'ok')).catch(()=>toast(t('file.copyFailed'),'warn')); }
function loadJsonFile(f){ const r=new FileReader(); r.onload=()=>{ try{ const doc=jsonToDoc(JSON.parse(r.result)); pushUndo(); state.image=null; state.doc=doc; state.openedNumber=null; state.openedKind=null; state.selection.clear(); state.gen.lastResult=null; const m=/(\d+)\.json$/i.exec(f.name); if(m) $('saveNumber').value=+m[1]; afterChange(); fitView(); render(); renderRail(); toast(t('file.imported',{name:f.name,w:doc.cols,h:doc.rows,n:doc.snakes.length,snakes:snakesWord(doc.snakes.length)}),'ok'); }catch(e){ toast(t('file.importFailed',{msg:e.message}),'bad'); } }; r.readAsText(f); }
/* Массовый импорт в библиотеку: несколько .json и/или .zip (все *.json внутри архива, в любых подпапках) */
function readFileText(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error||new Error('read')); r.readAsText(f); }); }
async function collectImportSources(files){ const sources=[]; let errors=0;
  for(const f of files){
    if(/\.zip$/i.test(f.name)){
      if(!window.JSZip){ toast(t('file.zipNoLib'),'warn'); errors++; continue; }
      try{ const zip=await JSZip.loadAsync(f); const names=Object.keys(zip.files).filter(n=>!zip.files[n].dir&&/\.json$/i.test(n)).sort();
        for(const n of names) sources.push({name:n.split('/').pop(), text:await zip.files[n].async('string')}); }
      catch(e){ errors++; toast(t('file.importFailed',{msg:f.name+': '+(e&&e.message||'?')}),'bad'); }
    } else { try{ sources.push({name:f.name, text:await readFileText(f)}); }catch(e){ errors++; } }
  }
  return {sources, errors}; }
async function importLevelsToLibrary(files){
  if(!Library.canWrite){ toast(t('save.readOnly'),'warn'); return; }
  const {sources, errors:readErrors}=await collectImportSources(files); let imported=0, errors=readErrors;
  const used=new Set(Library.items.map(it=>it.number)); let nextN=Math.max(0, ...Library.items.map(it=>it.number))+1;
  for(const src of sources){
    try{ const doc=jsonToDoc(JSON.parse(src.text)); const m=/(\d+)\.json$/i.exec(src.name); let n;
      if(m) n=+m[1]; else { while(used.has(nextN)) nextN++; n=nextN; }
      used.add(n); const s=solve(doc);
      const entry={id:'level_'+pad(n), number:n, cols:doc.cols, rows:doc.rows, snakes:doc.snakes.length, colors:uniqueColors(doc.snakes.map(x=>x.color)), solvable:!!s.solvable, depth:s.depth||0, updatedAt:new Date().toISOString(), doc:JSON.parse(JSON.stringify(doc))};
      await Library.put(entry); imported++; }
    catch(e){ errors++; }
  }
  renderRail(); toast(t('file.bulkImported',{n:imported,errors}), errors?'warn':'ok'); }
function showJson(){ const n=currentLevelNumber(); const j=exportJson(state.doc, n); openModal(levelFileName(n), `<div class="hint" style="margin-bottom:8px">${t('json.hint')}</div><pre>${escapeHtml(JSON.stringify(j,null,2))}</pre>`, [{label:t('btn.close')},{label:t('lv.copy'), onClick:copyJson},{label:t('json.download',{name:levelFileName(n)}), primary:true, onClick:downloadJson}]); }

  ['dragover','drop'].forEach(ev=>document.addEventListener(ev, e=>{ if(!e.target.closest('#canvasWrap,#panel')) e.preventDefault(); })); }

/* ================= Actions ================= */
function mirrorZoneMap(d){ const half=Math.floor(d.cols/2); for(let y=0;y<d.rows;y++) for(let x=0;x<half;x++) d.zoneMap[y*d.cols+(d.cols-1-x)]=d.zoneMap[y*d.cols+x]; recountZones(d); }
function runGenerate(){ const d=state.doc; pushUndo(); if(!d.zoneMap.some((z,i)=>z>=0&&d.zones[z]&&d.zones[z].isBody)){ d.zoneMap.fill(Math.max(0,state.gen.activeZone)); recountZones(d); toast(t('toast.regionWasEmpty')); }
  const g=state.gen; const t0=performance.now(); if(g.mirror) mirrorZoneMap(d);
  const res=generateWithDifficulty(d,{seed:g.seed, minLen:g.minLen, maxLen:g.maxLen, straightness:g.straight, difficulty:g.difficulty, pattern:g.pattern, mirror:g.mirror, axis:g.axis});
  g.seed=res.seed; g.lastResult={count:res.snakes.length, seed:res.seed, attempts:res.attempts, hit:res.hit};
  g.history=[{seed:res.seed,count:res.snakes.length,depth:res.metrics.depth,free:res.metrics.free,solvable:res.metrics.solvable,pattern:g.pattern,mirror:g.mirror,minLen:g.minLen,maxLen:g.maxLen,straight:g.straight}, ...g.history.filter(h=>h.seed!==res.seed)].slice(0,6);
  opReplaceSnakes(res.snakes, {source:'generate', seed:res.seed, image:state.image?state.image.name:null}, true, true);
  const outside=d.snakes.length-res.snakes.length;
  toast(t('toast.generated',{n:res.snakes.length,snakes:snakesWord(res.snakes.length),ms:Math.round(performance.now()-t0),seed:res.seed})+(res.attempts>1?t('toast.generatedAttempts',{n:res.attempts}):''), res.hit?'ok':'warn');
  if(outside>0) toast(t('toast.outsideKept',{n:outside}),'warn');
  if(res.dropped) toast(t('toast.droppedCells',{n:res.dropped}),'warn'); }
function setImage(img){ state.image=img; state.doc.meta.image=img.name;
  if(!img.cropped){ img=autoCropImage(img); state.image=img; }
  if(state.gen.mirror){ state.gen.mirror=false; toast(t('toast.mirrorOff')); }
  if(state.gen.width<24){ state.gen.width=34; toast(t('toast.gridTo34')); }
  setPanelTab('generate'); setFormMode('image',{silent:true}); applyImageGrid(); }
function applyImageGrid(){ const img=state.image; const cols=Math.max(2,Math.min(80,state.gen.width)), rows=Math.max(2,Math.min(80,Math.round(cols*img.h/img.w))); if(cols!==state.doc.cols||rows!==state.doc.rows) opResize(cols,rows); requantize(); }
function requantize(){ if(!state.image) return; const t0=performance.now(); const g=state.gen; const q=quantizeIcon(state.image, state.doc.cols, state.doc.rows, {K:g.autoK?'auto':g.k, minZone:g.minZone, outline:g.outline, ignoreDark:g.ignoreDark}); state.gen.foundK=q.autoK;
  opSetZones(q.zoneMap, q.zones, {image:state.image.name}); if(state.gen.activeZone>=state.doc.zones.length) state.gen.activeZone=0; const islands=q.zones.filter(z=>z.isIsland).length; toast(t('toast.zonesFound',{n:q.zones.filter(z=>z.isBody&&!z.isOutline).length,outline:q.zones.some(z=>z.isOutline)?' '+t('toast.plusOutline'):'',ms:Math.round(performance.now()-t0)})); if(islands) toast(t('toast.islands',{n:islands}),'warn'); }
function loadImageFile(f){ const url=URL.createObjectURL(f); const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); const s=Math.min(1, 1024/Math.max(im.width,im.height)); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); setImage(makeImage(c,f.name)); toast(t('toast.imageLoaded',{name:f.name}),'ok'); }; im.onerror=()=>toast(t('toast.imageFailed'),'bad'); im.src=url; }
function runValidate(){ state.validated=true; state.solve=solve(state.doc); state.errors=structuralErrors(state.doc); syncValidation(); render(); const s=state.solve;
  if(!s.total) toast(t('val.toastNone'),'warn'); else if(s.solvable&&!state.errors.length) toast(t('val.toastOk',{depth:s.depth}),'ok'); else toast((s.solvable?'':t('val.toastStuck',{n:s.stuck.length}))+(state.errors.length?(s.solvable?'':' · ')+t('val.toastErrors',{n:state.errors.length}):''),'bad'); }
const TOOL_ICONS={draw:'<svg viewBox="0 0 20 20"><path d="M4 16l1-4 8-8 3 3-8 8z"/><path d="M12 5l3 3"/></svg>',select:'<svg viewBox="0 0 20 20"><path d="M5 3l10 8-4 1 3 5-2 1-3-5-3 3z"/></svg>',erase:'<svg viewBox="0 0 20 20"><path d="M3 13l7-7 6 6-4 4H7z"/><path d="M8 16l-3-3"/><path d="M3 17h14"/></svg>',flip:'<svg viewBox="0 0 20 20"><path d="M4 7h11l-3-3"/><path d="M16 13H5l3 3"/></svg>',split:'<svg viewBox="0 0 20 20"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="14" r="2.2"/><path d="M8 7l9 7"/><path d="M8 13l9-7"/></svg>',merge:'<svg viewBox="0 0 20 20"><path d="M8 6H5a3 3 0 0 0 0 6h3"/><path d="M12 14h3a3 3 0 0 0 0-6h-3"/><path d="M7 10h6"/></svg>',brush:'<svg viewBox="0 0 20 20"><path d="M12 3l5 5-7 7-5-5z"/><path d="M5 10c-2 2-1 5-3 7 3 0 6 0 7-3"/></svg>'};
const TOOL_KEYS={draw:'D',select:'V',erase:'E',flip:'F',split:'S',merge:'M',brush:'B'};
const WELCOME_KEY='levelStudioWeb.welcomed.v2';
function showHelp(firstVisit){ const tools=Object.keys(TOOL_ICONS).map(k=>`<tr><td>${TOOL_ICONS[k]}</td><td>${t('tool.'+k+'.name')} <kbd>${TOOL_KEYS[k]}</kbd></td><td>${t('tool.'+k+'.help')}</td></tr>`).join('');
  const body=`<div class="help">
  <h4>${t('help.flowTitle')}</h4>
  <div class="flow">
    <div><i>1</i><b>${t('steps.shape')}</b>${t('help.flow1')}</div>
    <div><i>2</i><b>${t('steps.zones')}</b>${t('help.flow2')}</div>
    <div><i>3</i><b>${t('steps.snakes')}</b>${t('help.flow3')}</div>
    <div><i>4</i><b>${t('steps.done')}</b>${t('help.flow4')}</div>
  </div>
  <h4>${t('help.waysTitle')}</h4>
  <div class="ways">
    <div><b>${t('help.way1Title')}</b>${t('help.way1')}</div>
    <div><b>${t('help.way2Title')}</b>${t('help.way2')}</div>
  </div>
  <p class="tip" style="margin-top:8px">${t('help.rule')}</p>
  <h4>${t('help.toolsTitle')}</h4>
  <table>${tools}</table>
  <h4>${t('help.keysTitle')}</h4>
  <div class="keys">
    <span><kbd>1</kbd>–<kbd>9</kbd></span><span>${t('help.k.colors')}</span>
    <span><kbd>G</kbd> / <kbd>P</kbd></span><span>${t('help.k.gp')}</span>
    <span><kbd>Ctrl+Z</kbd> / <kbd>Ctrl+Y</kbd></span><span>${t('help.k.undo')}</span>
    <span><kbd>Ctrl+A</kbd> / <kbd>Delete</kbd></span><span>${t('help.k.select')}</span>
    <span><kbd>Ctrl+S</kbd></span><span>${t('help.k.save')}</span>
    <span><kbd>Esc</kbd></span><span>${t('help.k.esc')}</span>
    <span><kbd>Space</kbd>+drag</span><span>${t('help.k.pan')}</span>
    <span><kbd>X</kbd> / <kbd>Alt</kbd>+drag</span><span>${t('help.k.brushErase')}</span>
  </div>
  <h4>${t('help.whereTitle')}</h4>
  <p class="tip">${t('help.where')}</p>
  </div>`;
  openModal(firstVisit? t('help.welcomeTitle') : t('help.title'), body, [{label:firstVisit? t('help.start') : t('btn.ok'), primary:true, onClick:()=>{ try{ localStorage.setItem(WELCOME_KEY,'1'); }catch(e){} }}]); }

/* ================= Modal / toast ================= */
function openModal(title, body, buttons){ $('modalTitle').textContent=title; const b=$('modalBody'); b.innerHTML=''; if(typeof body==='string') b.innerHTML=body; else b.append(body); const f=$('modalFoot'); f.innerHTML='';
  (buttons||[{label:t('btn.ok')}]).forEach(bt=>{ const el=document.createElement('button'); el.textContent=bt.label; if(bt.primary) el.className='primary'; el.onclick=()=>{ closeModal(); bt.onClick&&bt.onClick(); }; f.append(el); }); $('modalBack').classList.add('open'); f.lastChild.focus(); }
function closeModal(){ $('modalBack').classList.remove('open'); }
$('modalBack').addEventListener('click', e=>{ if(e.target===$('modalBack')) closeModal(); });
const TOAST_MAX=3, TOAST_MS=3000;
function toast(msg, kind){ if(state.quiet) return; const box=$('toasts'); while(box.children.length>=TOAST_MAX) box.firstChild.remove(); const tt=document.createElement('div'); tt.className='toast '+(kind||''); tt.textContent=msg; tt.title=t('toast.dismiss'); tt.onclick=()=>tt.remove(); box.append(tt); setTimeout(()=>tt.remove(), TOAST_MS); }
function escapeHtml(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ================= Draft (этот браузер) ================= */
const DRAFT_KEY='levelStudioWeb.draft.v1';
function saveDraft(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({doc:state.doc, gen:{...state.gen,lastResult:null}, saveNumber:$('saveNumber').value, openedNumber:state.openedNumber, openedKind:state.openedKind, panelTab:state.panelTab, formMode:state.formMode, palette:state.palette, nextId})); state.draftAt=new Date().toLocaleTimeString(LANG==='ru'?'ru-RU':'en-US', {hour:'2-digit',minute:'2-digit'}); syncStatus(); }catch(e){} }
function restoreDraft(){ try{ const raw=localStorage.getItem(DRAFT_KEY); if(!raw) return false; const d=JSON.parse(raw); if(!d.doc||!d.doc.snakes) return false; state.doc=d.doc; Object.assign(state.gen,d.gen||{}); state.openedNumber=d.openedNumber??null; state.openedKind=d.openedKind||null; if(d.palette) state.palette=d.palette; nextId=Math.max(d.nextId||1, ...state.doc.snakes.map(s=>s.id+1), 1); $('saveNumber').value=d.saveNumber||nextFreeNumber(); state.panelTab=d.panelTab||'generate'; state.formMode=d.formMode||'image'; return true; }catch(e){ return false; } }

/* ================= Keyboard ================= */
window.addEventListener('keydown', e=>{ const tag=(e.target.tagName||'').toLowerCase(); const typing=tag==='input'||tag==='select'||tag==='textarea'; if($('modalBack').classList.contains('open')){ if(e.key==='Escape') closeModal(); return; }
  if((e.ctrlKey||e.metaKey)&&!typing){ const k=e.key.toLowerCase(); if(k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); } else if(k==='y'){ e.preventDefault(); redo(); } else if(k==='a'){ e.preventDefault(); setTool('select'); state.doc.snakes.forEach(s=>state.selection.add(s.id)); syncSelectionUI(); render(); } else if(k==='s'){ e.preventDefault(); runSave(); } return; }
  if(typing) return;
  if(e.code==='Space'){ state.spaceDown=true; canvas.style.cursor='grab'; e.preventDefault(); return; }
  const k=e.key.toLowerCase(); const map={d:'draw',v:'select',e:'erase',f:'flip',s:'split',m:'merge',b:'brush'};
  if(map[k]){ if(k==='f'&&state.selection.size&&state.tool==='select'){ opFlip([...state.selection]); return; } setTool(map[k]); return; }
  if(/^[1-9]$/.test(e.key)&&state.palette[+e.key-1]){ pickColor(+e.key-1); return; }
  if(e.key==='Delete'||e.key==='Backspace'){ if(state.selection.size) opDelete([...state.selection]); return; }
  if(e.key==='Escape'&&state.preview){ setPreview(false); return; }
  if(k==='p'){ setPreview(!state.preview); return; }
  if(e.key==='Escape'){ state.stroke=null; state.mergePending=null; state.marquee=null; state.selection.clear(); syncSelectionUI(); render(); return; }
  if(k==='x'&&state.tool==='brush'){ state.gen.brushErase=!state.gen.brushErase; syncInspector(); syncToolbar(); render(); return; }
  if(k==='g'){ runGenerate(); return; } if(e.key==='?'){ showHelp(false); } });
window.addEventListener('keyup', e=>{ if(e.code==='Space'){ state.spaceDown=false; canvas.style.cursor=state.preview?'default':TOOLS[state.tool].cursor; } });

/* ================= Init ================= */
function loadSampleIcon(i){ const ic=SAMPLE_ICONS[i]; const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=im.width; c.height=im.height; c.getContext('2d').drawImage(im,0,0); setImage(makeImage(c, ic.name+'.png')); toast(t('toast.sampleLoaded',{emoji:ic.emoji,name:ic.name}),'ok'); }; im.src=ic.png; }
function initIconStrip(){ const el=$('iconStrip'); el.innerHTML=SAMPLE_ICONS.map((ic,i)=>`<button class="icon-btn" data-i="${i}" title="${ic.emoji} ${ic.name}"><img src="${ic.png}" alt="${ic.name}"></button>`).join(''); el.querySelectorAll('.icon-btn').forEach(b=>b.onclick=()=>loadSampleIcon(+b.dataset.i)); }
function seedDemo(){ state.quiet=true; state.doc=makeDoc(20,20); afterChange(); setImage(sampleHeart()); runGenerate(); state.undo.length=0; state.quiet=false; }
(function init(){ state.libTab='game'; state.panelTab='generate'; state.formMode='image'; state.openedKind=null; state.savedSnapshot=null; setLang(initialLang()); initIconStrip(); const restored=restoreDraft();
  PALETTE_SEED.forEach(([name,hex])=>{ if(!state.palette.some(p=>p.hex===hex)) state.palette.push({name,hex}); });
  if(!restored){ $('saveNumber').value=nextFreeNumber(); seedDemo(); }
  setTool('draw'); setPanelTab(state.panelTab); setFormMode(state.formMode,{silent:true}); afterChange(); fitView(); render(); renderRail();
  Library.onChange(()=>{ renderRail(); syncInspector(); }); Library.init();
  let welcomed=false; try{ welcomed=!!localStorage.getItem(WELCOME_KEY); }catch(e){}
  if(!welcomed) showHelp(true); else if(restored) toast(t('toast.draftRestored'),'ok'); else toast(t('toast.demo')); })();
</script>
